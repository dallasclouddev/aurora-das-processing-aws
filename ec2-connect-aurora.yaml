AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  #Parameter that AWS maintains
  AmiId:
    Type: String
    Default: 'ami-08b5b3a93ed654d19' #AWS Linux 2 AMI al2023-ami-2023.6.20250303.0-kernel-6.1-x86_64 for us-east-1
    Description: AMI ID to be used in the EC2 instance


  ExistingVPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Aurora cluster is deployed
    Default: vpc-059b3df4da7d00112

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet ID for the EC2 instance
    Default: subnet-019ec80eb58138877

  AuroraSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID of the Aurora cluster
    Default: sg-087c1d3abf61e170e

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of existing EC2 KeyPair for SSH access
    Default: us-east-1-ec2-key

  InstanceType:
    Type: String
    Default: t3.small
    Description: EC2 instance type

  SecretId:
    Type: String
    Default: 'rds!cluster-09cbfc0d-f087-4779-a4b6-cfd855d35a39'
    Description: 'Aurora cluster secret ID from Secrets Manager'

Resources:
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
#    GroupName: !Sub ${AWS::StackName}-sg
    Properties:
      GroupDescription: Security group for EC2 instance to connect to Aurora
      VpcId: !Ref ExistingVPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 99.65.56.253/32  # Consider restricting to your IP range
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2-sg

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonRDSFullAccess
        - arn:aws:iam::aws:policy/AmazonKinesisFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedEC2InstanceDefaultPolicy
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2-role

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2Role

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref EC2InstanceProfile
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      KeyName: !Ref KeyPairName
      ImageId: !Ref AmiId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
              # Start timing
          echo "UserData script started at: $(date)"
          # Enable error logging
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          # Fix Python symlink for dnf
          ln -sf /usr/bin/python3.9 /usr/bin/python3
          # Install development tools and dependencies
          echo "Installing development tools and dependencies..."
          dnf groupinstall "Development Tools" -y
          dnf install openssl-devel bzip2-devel libffi-devel zlib-devel readline-devel sqlite-devel xz-devel -y
          cd /opt
          wget https://www.python.org/ftp/python/3.13.0/Python-3.13.0a5.tgz
          tar xzf Python-3.13.0a5.tgz
          cd Python-3.13.0a5
          ./configure --enable-optimizations --with-ensurepip=install --prefix=/usr/local
          # Get number of CPU cores for parallel build
          CORES=$(nproc)
          echo "Building Python using $CORES cores..."
          make -j "$CORES"
          
          echo "Installing Python..."
          make altinstall

          # Remove any existing PostgreSQL
          dnf remove postgresql* -y
    
          # Install PostgreSQL 16
          dnf install -y postgresql16
          
          # Get credentials and store them properly
          # Try to set up database credentials, but don't fail if it doesn't work
          {
            # Get credentials and store them properly
            DB_CREDS="$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id '${SecretId}' --query 'SecretString' --output text)"
            
            # Parse the JSON string and store values
            DB_USERNAME=$(echo $DB_CREDS | jq -r '.username')
            DB_PASSWORD=$(echo $DB_CREDS | jq -r '.password')
      
            if [ ! -z "$DB_PASSWORD" ]; then
      
              # Add PostgreSQL environment variables
              cat > /etc/profile.d/psql_env.sh << EOF
              export PGHOST='database-das-instance-1.czs7ypx6yux2.us-east-1.rds.amazonaws.com'
              export PGUSER='postgres'
              export PGDATABASE='postgres'
              EOF
              
              echo "PostgreSQL credentials setup completed successfully"
            else
              echo "Skipping PostgreSQL credentials setup - no credentials retrieved"
            fi
          } || {
            echo "PostgreSQL credentials setup failed, but continuing with instance setup"
          }
          echo "UserData script completed at: $(date)"





  # Allow EC2 to access Aurora
  AuroraIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AuroraSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EC2SecurityGroup

Outputs:
  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance

  EC2PublicDNS:
    Description: Public DNS name of EC2 instance
    Value: !GetAtt EC2Instance.PublicDnsName

  EC2SecurityGroupId:
    Description: Security Group ID for EC2 instance
    Value: !Ref EC2SecurityGroup
